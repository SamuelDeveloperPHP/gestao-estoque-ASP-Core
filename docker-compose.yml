# Ambiente local. Copie .env.example para .env e defina POSTGRES_PASSWORD.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: gestao_estoque
      POSTGRES_USER: estoque
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estoque -d gestao_estoque"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Database=gestao_estoque;Username=estoque;Password=${POSTGRES_PASSWORD}"
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  pgdata:

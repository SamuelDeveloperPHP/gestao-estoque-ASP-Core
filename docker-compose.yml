# Ambiente local. Copie .env.example para .env e preencha os valores.
services:
  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: estoque
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?defina RABBITMQ_PASSWORD no .env}
    ports:
      - "127.0.0.1:15672:15672" # console de administração
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686" # UI de traces

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: gestao_estoque
      POSTGRES_USER: estoque
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estoque -d gestao_estoque"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      RabbitMq__Host: rabbitmq
      RabbitMq__User: estoque
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
      Database__MigrateOnStartup: "true" # só local; em produção use um Job
      Swagger__Enabled: "true" # só local
      ConnectionStrings__Postgres: "Host=postgres;Database=gestao_estoque;Username=estoque;Password=${POSTGRES_PASSWORD}"
      Jwt__Key: ${JWT_KEY:?defina JWT_KEY no .env (mínimo 32 caracteres)}
      ForwardedHeaders__Enabled: "true" # confia no IP repassado pelo Web; a API só escuta em localhost
      Identidade__AdminEmail: ${ADMIN_EMAIL:?defina ADMIN_EMAIL no .env}
      Identidade__AdminSenha: ${ADMIN_PASSWORD:?defina ADMIN_PASSWORD no .env}
    ports:
      - "127.0.0.1:8080:8080"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    depends_on:
      - api
    environment:
      Api__BaseUrl: "http://api:8080"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
    ports:
      - "127.0.0.1:8081:8080"

volumes:
  pgdata:

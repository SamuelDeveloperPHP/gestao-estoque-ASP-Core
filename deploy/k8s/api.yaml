apiVersion: apps/v1
kind: Deployment
metadata:
  name: gestao-estoque-api
spec:
  replicas: 2
  selector:
    matchLabels: { app: gestao-estoque-api }
  template:
    metadata:
      labels: { app: gestao-estoque-api }
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: api
          image: gestao-estoque:latest # trocar pela tag do registry
          ports:
            - containerPort: 8080
          env:
            - name: ConnectionStrings__Postgres
              valueFrom:
                secretKeyRef: { name: gestao-estoque-db, key: connection-string }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          livenessProbe:
            httpGet: { path: /health/live, port: 8080 }
          readinessProbe:
            httpGet: { path: /health/ready, port: 8080 }
---
apiVersion: v1
kind: Service
metadata:
  name: gestao-estoque-api
spec:
  selector: { app: gestao-estoque-api }
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gestao-estoque-api
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: gestao-estoque-api }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gestao-estoque-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gestao-estoque-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
